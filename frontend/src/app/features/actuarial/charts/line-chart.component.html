<figure class="viz">
  <div class="viz-toolbar">
    @if (series().length > 1 || reference()) {
      <div class="legend" aria-hidden="true">
        @for (s of series(); track s.key) {
          <span class="legend-item"><span [class]="'swatch ' + s.tone"></span>{{ s.name }}</span>
        }
        @if (referenceLabel()) {
          <span class="legend-item"><span class="swatch reference"></span>{{ referenceLabel() }}</span>
        }
      </div>
    } @else {
      <span></span>
    }
    <button type="button" class="table-toggle" (click)="showTable.set(!showTable())"
            [attr.aria-pressed]="showTable()">
      {{ showTable() ? 'Voir le graphique' : 'Voir le tableau' }}
    </button>
  </div>

  @if (!showTable()) {
    <div class="plot-wrap">
      <svg #plot class="plot" [attr.width]="width()" [attr.height]="height"
           [attr.viewBox]="'0 0 ' + width() + ' ' + height"
           role="img" [attr.aria-label]="ariaLabel()" tabindex="0"
           (pointermove)="onPointerMove($event)" (pointerleave)="clearHover()"
           (keydown)="onKeydown($event)" (blur)="clearHover()">

        @for (tick of yTicks(); track tick) {
          <line class="grid" [attr.x1]="margin.left" [attr.x2]="width() - margin.right"
                [attr.y1]="yScale()(tick)" [attr.y2]="yScale()(tick)" />
          <text class="tick y" [attr.x]="margin.left - 8" [attr.y]="yScale()(tick)">{{ yFormat()(tick) }}</text>
        }
        @for (tick of xTicks(); track tick) {
          <text class="tick x" [attr.x]="xScale()(tick)" [attr.y]="height - margin.bottom + 16">{{ xFormat()(tick) }}</text>
        }
        <line class="axis" [attr.x1]="margin.left" [attr.x2]="width() - margin.right"
              [attr.y1]="height - margin.bottom" [attr.y2]="height - margin.bottom" />

        @if (xLabel()) {
          <text class="axis-label" [attr.x]="(margin.left + width() - margin.right) / 2" [attr.y]="height - 6">{{ xLabel() }}</text>
        }

        @if (referencePath(); as d) {
          <path class="reference" [attr.d]="d" />
        }

        @for (s of paths(); track s.key) {
          <path [class]="'line ' + s.tone" [attr.d]="s.d" />
          @if (markers()) {
            @for (p of s.points; track $index) {
              <circle [class]="'marker ' + s.tone" r="4.5"
                      [attr.cx]="xScale()(p.x)" [attr.cy]="yScale()(p.y)" />
            }
          }
        }

        @if (hover(); as h) {
          <line class="crosshair" [attr.x1]="h.cx" [attr.x2]="h.cx"
                [attr.y1]="margin.top" [attr.y2]="height - margin.bottom" />
          @for (row of h.rows; track row.key) {
            <circle [class]="'focus ' + row.tone" r="5" [attr.cx]="h.cx" [attr.cy]="row.cy" />
          }
        }
      </svg>

      @if (yLabel()) {
        <span class="y-label">{{ yLabel() }}</span>
      }

      @if (hover(); as h) {
        <div class="tooltip" [class.right]="h.alignRight" [style.left.px]="h.cx">
          <div class="tooltip-title">{{ xLabel() }} : {{ xFormat()(h.x) }}</div>
          @for (row of h.rows; track row.key) {
            <div class="tooltip-row">
              <span [class]="'swatch ' + row.tone"></span>
              <span>{{ row.name }}</span>
              <strong>{{ yFormat()(row.y) }}</strong>
            </div>
          }
        </div>
      }
    </div>
  } @else {
    <div class="table-scroll">
      <table class="viz-table">
        <thead>
          <tr>
            <th>{{ xLabel() }}</th>
            @for (s of series(); track s.key) { <th class="num">{{ s.name }}</th> }
          </tr>
        </thead>
        <tbody>
          @for (row of tableRows(); track $index) {
            <tr>
              <td>{{ xFormat()(row.x) }}</td>
              @for (value of row.values; track $index) { <td class="num">{{ yFormat()(value) }}</td> }
            </tr>
          }
        </tbody>
      </table>
    </div>
  }

  @if (caption()) {
    <figcaption>{{ caption() }}</figcaption>
  }
</figure>
