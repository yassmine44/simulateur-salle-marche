spring.application.name=simulateur-backend
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/simulateur_salle_marche
spring.datasource.username=simulateur_app
spring.datasource.password=${DB_PASSWORD}

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.default-encoding=UTF-8

app.frontend.base-url=http://localhost:4200


# =========================
# GOOGLE OAUTH2 / OIDC
# =========================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# =========================
# RECAPTCHA ENTERPRISE
# =========================

app.recaptcha.project-id=${RECAPTCHA_PROJECT_ID}
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY}
app.recaptcha.api-key=${RECAPTCHA_API_KEY}

app.recaptcha.min-score=0.5