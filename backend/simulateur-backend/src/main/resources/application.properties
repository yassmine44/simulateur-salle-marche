spring.application.name=simulateur-backend
server.port=8081

# Journal du serveur dans un fichier (en plus de la console) :
# permet de retrouver la cause exacte d'une "Erreur du serveur".
logging.file.name=${java.io.tmpdir}/simulateur-backend.log

spring.datasource.url=jdbc:postgresql://localhost:5432/simulateur_salle_marche
spring.datasource.username=simulateur_app
spring.datasource.password=${DB_PASSWORD}

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update

# Remplace par OpenEntityManagerInViewConfig, qui exclut les flux temps reel (SSE) :
# sinon chaque flux ouvert garde une connexion a la base pendant plusieurs minutes.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.default-encoding=UTF-8

app.frontend.base-url=http://localhost:4200

# Banking stress AI (remote Ollama via Ngrok when enabled).
app.banking-stress.ai.enabled=${BANKING_STRESS_AI_ENABLED:false}
app.banking-stress.ai.ollama.model=${OLLAMA_MODEL:llama3.2}
app.banking-stress.ai.ollama.base-url=${OLLAMA_BASE_URL:https://modular-spectacle-stopping.ngrok-free.dev}
app.banking-stress.ai.connect-timeout=5s
app.banking-stress.ai.read-timeout=60s

# Multiplayer + solo voice analyst → remote Ollama (Ngrok) → browser speechSynthesis.
app.flash.ai.enabled=${FLASH_AI_ENABLED:true}
app.flash.ai.ollama.model=${OLLAMA_MODEL:llama3.2}
app.flash.ai.ollama.base-url=${OLLAMA_BASE_URL:https://modular-spectacle-stopping.ngrok-free.dev}
app.flash.ai.connect-timeout=5s
app.flash.ai.read-timeout=45s


# =========================
# GOOGLE OAUTH2 / OIDC
# =========================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# =========================
# RECAPTCHA ENTERPRISE
# =========================

app.recaptcha.project-id=${RECAPTCHA_PROJECT_ID}
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY}
app.recaptcha.api-key=${RECAPTCHA_API_KEY}

app.recaptcha.min-score=0.5

# =========================
# TRADING
# =========================

# Ecart maximal (en %) entre le prix d'un ordre et le dernier cours. 0 = desactive.
app.trading.price-band-percent=20

# =========================
# PORTEFEUILLE
# =========================

# Capital virtuel de depart de chaque utilisateur.
app.portfolio.initial-capital=100000
app.portfolio.currency=USD
# true : un ordre est refuse si les fonds (achat) ou les titres (vente)
# disponibles sont insuffisants. La vente a decouvert est alors impossible.
app.portfolio.enforce-limits=true

# =========================
# MODULE D'ACTUARIAT (ml-service FastAPI, routes /api/actuarial/*)
# =========================
app.actuarial.ml-service.base-url=${ACTUARIAL_ML_URL:http://localhost:5000}
app.actuarial.ml-service.connect-timeout=2s
app.actuarial.ml-service.read-timeout=10s

# =========================
# GAMIFICATION ML SERVICE
# =========================
# Python FastAPI microservice (RandomForestClassifier) used by QuantitativeEngine.
# Spring triggers async POST /api/retrain on startup (2018–2026 histo + S&P CSVs)
# so challenges call instant inference with no live training delay.
gamification.ml-service.enabled=true
gamification.ml-service.base-url=http://localhost:5000
gamification.ml-service.connect-timeout-ms=2000
gamification.ml-service.read-timeout-ms=3000


# Teneur de marche automatique : alimente le carnet de chaque actif.
app.market-maker.enabled=true
app.market-maker.interval-ms=5000
app.market-maker.levels=5
# Probabilite, par cycle et par actif, de simuler une transaction de marche.
app.market-maker.trade-probability=0.25