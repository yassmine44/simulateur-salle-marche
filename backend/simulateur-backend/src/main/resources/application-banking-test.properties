# Requires an independently verified, test-only PostgreSQL instance at localhost:5432.
# The simulateur_banking_test role must have access only to simulateur_scenario_test.
# Provision and verify that role and instance out of band before any connection.
spring.datasource.url=jdbc:postgresql://localhost:5432/simulateur_scenario_test
spring.datasource.username=simulateur_banking_test
spring.datasource.password=${SIMULATEUR_SCENARIO_TEST_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=false
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=none
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false

app.market-maker.enabled=false
app.trading.expiry-enabled=false
