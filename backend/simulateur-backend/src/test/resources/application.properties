spring.datasource.url=jdbc:h2:mem:registration-tests;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Permet à Spring Boot de créer JavaMailSender pendant les tests de contexte.
# Aucun e-mail n'est envoyé par les tests d'authentification.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test
app.frontend.base-url=http://localhost:4200

# Valeurs factices : aucun appel reCAPTCHA ni Google n'est fait par les tests.
app.recaptcha.project-id=test-project
app.recaptcha.site-key=test-site-key
app.recaptcha.api-key=test-api-key

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Les tests pilotent eux-memes le teneur de marche et les regles de prix.
app.market-maker.enabled=false
app.trading.price-band-percent=0

# Les tests du carnet supposent des ordres sans contrôle de fonds :
# PortfolioTests active le contrôle lui-même.
app.portfolio.enforce-limits=false

# Echeance des ordres DAY : les tests l appellent directement.
app.trading.expiry-enabled=false
